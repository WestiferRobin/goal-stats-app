name: app-local
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: development
    init: true
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - ../src:/app/src:ro
      - ../public:/app/public:ro
      - next-cache:/app/.next
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 15s
volumes:
  next-cache:
