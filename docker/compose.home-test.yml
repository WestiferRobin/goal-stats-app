# Only scripts/test-home.sh owns these disposable resources. No host ports.
services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_USER: goalstats
      POSTGRES_PASSWORD: ${HOME_TEST_DB_PASSWORD:?Owned test password required}
      POSTGRES_DB: goalstats_home_test
    volumes: ["home-test-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goalstats -d goalstats_home_test"]
      interval: 1s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7.4-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs: ["/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 40
  template:
    image: ${HOME_TEST_TEMPLATE_IMAGE:?Owned Template image required}
    environment:
      # Container-local control socket; frozen image user has no writable home.
      XDG_RUNTIME_DIR: /tmp
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://goalstats:${HOME_TEST_DB_PASSWORD:?}@postgres:5432/goalstats_home_test
      REDIS_URL: redis://redis:6379/0
      CACHE_KEY_PREFIX: home-demo:test:v1
      OPENAPI_ENABLED: "true"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  app-under-test:
    image: ${APP_TEST_IMAGE:?Owned App image required}
    init: true
    environment:
      HOME_API_BASE_URL: http://template:8000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  home-test-data:
